[project]
name = "calm-octopuses"
version = "0.1.0"
description = "Streamlit application for multimodal Michelin NYC restaurant discovery."
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "data",
    "pytest-cache-files-*",
]
